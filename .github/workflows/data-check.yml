# Monthly data freshness report, kept in one open issue labelled "data-refresh".
name: data-check

on:
  schedule:
    - cron: "0 1 1 * *"   # 1st of every month, 09:00 Beijing time
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run -s data:check > report.md
      - name: Create or update the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create data-refresh --color 0f6a4a --description "路书数据待更新" 2>/dev/null || true
          num=$(gh issue list --label data-refresh --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file report.md
          else
            gh issue create --title "数据待更新清单" --label data-refresh --body-file report.md
          fi
